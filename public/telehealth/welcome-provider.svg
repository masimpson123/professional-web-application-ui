<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" preserveAspectRatio="xMidYMid slice">
  <!--
    The provider's welcome banner: a calm counseling room, two chairs set for a
    conversation. A stand-in illustration until there's a photo for providers.
    The left side stays dark so the white headline reads over it.
  -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="0.45" stop-color="#16295a"/>
      <stop offset="1" stop-color="#26407a"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0ee"/>
      <stop offset="1" stop-color="#e9d9b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.75" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fff2cf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff2cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2d2a"/>
      <stop offset="1" stop-color="#241b1a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="430" fill="url(#wall)"/>
  <rect width="1600" height="430" fill="url(#sun)"/>

  <!-- Window, light falling into the room -->
  <rect x="1010" y="44" width="300" height="236" rx="6" fill="#0f2147"/>
  <rect x="1022" y="56" width="276" height="212" rx="3" fill="url(#window)"/>
  <path d="M1022 210 C1080 190 1140 200 1200 185 S1280 175 1298 182 V268 H1022 Z" fill="#9cc4a4" opacity="0.7"/>
  <rect x="1157" y="56" width="6" height="212" fill="#0f2147"/>
  <rect x="1022" y="159" width="276" height="6" fill="#0f2147"/>
  <path d="M1022 268 L960 360 H1420 L1298 268 Z" fill="#fff2cf" opacity="0.06"/>

  <!-- Bookshelf -->
  <rect x="1370" y="70" width="170" height="270" rx="4" fill="#1a2c58"/>
  <g fill="#0f1f45">
    <rect x="1380" y="132" width="150" height="6"/>
    <rect x="1380" y="200" width="150" height="6"/>
    <rect x="1380" y="268" width="150" height="6"/>
  </g>
  <g>
    <rect x="1388" y="92" width="14" height="40" fill="#d9a441"/>
    <rect x="1404" y="98" width="12" height="34" fill="#4f8f94"/>
    <rect x="1418" y="88" width="16" height="44" fill="#c96b4f"/>
    <rect x="1440" y="104" width="44" height="28" rx="4" fill="#2f7f86"/>
    <rect x="1392" y="160" width="12" height="40" fill="#8fb6c9"/>
    <rect x="1406" y="166" width="14" height="34" fill="#d9a441"/>
    <rect x="1470" y="158" width="14" height="42" fill="#c96b4f"/>
    <rect x="1486" y="164" width="12" height="36" fill="#4f8f94"/>
    <circle cx="1440" cy="250" r="16" fill="#3e7d55"/>
    <rect x="1430" y="250" width="20" height="18" rx="3" fill="#c96b4f"/>
    <rect x="1470" y="230" width="14" height="38" fill="#8fb6c9"/>
    <rect x="1486" y="236" width="16" height="32" fill="#d9a441"/>
  </g>

  <!-- Floor and rug -->
  <rect y="340" width="1600" height="90" fill="url(#floor)"/>
  <ellipse cx="1110" cy="380" rx="300" ry="34" fill="#5a7f8c" opacity="0.55"/>

  <!-- Floor lamp, warm light -->
  <circle cx="760" cy="150" r="150" fill="url(#glow)"/>
  <rect x="756" y="150" width="6" height="200" fill="#c9b48a"/>
  <path d="M722 120 H796 L782 160 H736 Z" fill="#f2d79b"/>
  <ellipse cx="759" cy="352" rx="30" ry="6" fill="#1a1412"/>

  <!-- Chair, facing right -->
  <g>
    <rect x="850" y="230" width="150" height="96" rx="26" fill="#2f7f86"/>
    <rect x="838" y="180" width="60" height="150" rx="28" fill="#286d73"/>
    <rect x="860" y="268" width="148" height="42" rx="18" fill="#3b9199"/>
    <rect x="866" y="326" width="10" height="26" rx="3" fill="#1a1412"/>
    <rect x="980" y="326" width="10" height="26" rx="3" fill="#1a1412"/>
  </g>

  <!-- Side table: a plant and two cups -->
  <g>
    <rect x="1080" y="290" width="70" height="8" rx="3" fill="#c9b48a"/>
    <rect x="1111" y="298" width="8" height="52" fill="#a8946d"/>
    <rect x="1094" y="268" width="20" height="22" rx="4" fill="#efe6d4"/>
    <rect x="1124" y="272" width="18" height="18" rx="4" fill="#f2d79b"/>
    <ellipse cx="1104" cy="252" rx="10" ry="18" fill="#3e7d55" transform="rotate(-20 1104 252)"/>
    <ellipse cx="1116" cy="248" rx="9" ry="20" fill="#4c9466" transform="rotate(15 1116 248)"/>
  </g>

  <!-- Chair, facing left -->
  <g>
    <rect x="1200" y="230" width="150" height="96" rx="26" fill="#d9a441"/>
    <rect x="1302" y="180" width="60" height="150" rx="28" fill="#c2913a"/>
    <rect x="1192" y="268" width="148" height="42" rx="18" fill="#e6b65a"/>
    <rect x="1210" y="326" width="10" height="26" rx="3" fill="#1a1412"/>
    <rect x="1324" y="326" width="10" height="26" rx="3" fill="#1a1412"/>
  </g>

  <!-- Plant in the corner -->
  <g>
    <rect x="1560" y="300" width="40" height="50" rx="6" fill="#c96b4f"/>
    <ellipse cx="1572" cy="270" rx="16" ry="40" fill="#3e7d55" transform="rotate(-18 1572 270)"/>
    <ellipse cx="1592" cy="262" rx="14" ry="44" fill="#4c9466" transform="rotate(12 1592 262)"/>
  </g>
</svg>
