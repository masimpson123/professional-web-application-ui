<compsych-dialog
  variant="modal-leading-icon"
  icon="message-circle-heart"
  width="min(560px, 94vw)"
  title="What would you like to focus on?"
  [open]="open()"
  (closed)="cancel()"
>
  <p class="lead">{{ provider() }} will see this before your session. Share as much or as little as you like.</p>

  <app-focus-fields [field]="fields" idPrefix="edit-focus" />

  <p class="safety">
    If you’re in immediate danger, don’t wait for your session. Call 911, or call or text 988 to reach the
    Suicide &amp; Crisis Lifeline.
  </p>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <compsych-button cmpDialogActions variant="outlined" fullWidth label="Cancel" (click)="cancel()" />
  <compsych-button
    cmpDialogActions
    variant="filled"
    fullWidth
    label="Save focus"
    [loading]="fields().submitting()"
    (click)="save()"
  />
</compsych-dialog>
