<app-demo-header id="cube" />

<section class="stage">
  <div class="row controls">
    <div class="field">
      <label for="cube-tilt">Tilt</label>
      <input
        id="cube-tilt"
        type="range"
        min="1"
        max="100"
        value="60"
        #mySlider
        (input)="rotationUpdate(mySlider.value)" />
    </div>
    <div class="field">
      <label for="cube-zoom">Zoom</label>
      <input
        id="cube-zoom"
        type="range"
        min="1"
        max="135"
        value="75"
        #myZoomSlider
        (input)="zoomUpdate(myZoomSlider.value)" />
    </div>
  </div>
  <canvas #canvas id="canvas" aria-label="Rotating cube. Point at a face to highlight it."></canvas>
</section>
